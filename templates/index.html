<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>消息生成器</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-alt: #f5f5f7;
      --border: #e8e8ec;
      --border-light: #f0f0f3;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #aeaeb2;
      --accent: #c0392b;
      --accent-light: #fdf2f0;
      --accent-hover: #a83224;
      --blue: #0071e3;
      --green: #34c759;
      --orange: #ff9500;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.03);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.88);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-right: 28px;
    }
    .nav-links { display: flex; gap: 2px; }
    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 0.84rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface-alt); }
    .nav-link.active { color: var(--accent); background: var(--accent-light); font-weight: 600; }
    .nav-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .nav-btn {
      background: var(--surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .nav-btn:hover { color: var(--text); border-color: #ccc; }

    /* ── CONFIG BAR ── */
    .config-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
    }
    .config-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      cursor: pointer;
      user-select: none;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .config-toggle:hover { color: var(--text); }
    .config-toggle .arrow {
      font-size: 0.65rem;
      transition: transform 0.2s;
      display: inline-block;
    }
    .config-toggle.open .arrow { transform: rotate(90deg); }
    .config-summary {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-tertiary);
      margin-left: 6px;
    }

    .config-body { display: none; padding-bottom: 20px; }
    .config-body.open { display: block; }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr;
      gap: 16px;
    }
    .config-field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .config-field input,
    .config-field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.84rem;
      font-family: var(--font);
      outline: none;
      transition: all 0.2s;
      color: var(--text);
      resize: none;
    }
    .config-field input:focus,
    .config-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192,57,43,0.08);
    }

    .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      font-size: 0.74rem;
      padding: 4px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--text); border-color: var(--text); color: white; }

    /* Mode tabs */
    .mode-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .mode-tab {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .mode-tab:hover { border-color: var(--accent); color: var(--accent); }
    .mode-tab.active { background: var(--text); border-color: var(--text); color: white; }

    /* Sender */
    .sender-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }
    .sender-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .sender-grid input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-family: var(--font);
      outline: none;
      color: var(--text);
    }
    .sender-grid input:focus { border-color: var(--accent); }
    .sender-saved {
      font-size: 0.74rem;
      color: var(--green);
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .sender-saved.show { opacity: 1; }

    /* Provider */
    .provider-tabs { display: flex; gap: 5px; margin-bottom: 8px; }
    .model-fields { display: flex; gap: 8px; }
    .model-fields input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-family: var(--mono);
      outline: none;
      color: var(--text);
    }
    .model-fields input:focus { border-color: var(--accent); }
    .field-hint { font-size: 0.72rem; color: var(--text-tertiary); margin-top: 4px; }

    /* ── MAIN GRID ── */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--surface-alt);
      color: var(--text-tertiary);
      padding: 3px 10px;
      border-radius: 6px;
    }
    .panel-body { padding: 16px 20px; }

    textarea.input-area {
      width: 100%;
      height: 200px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 0.84rem;
      font-family: var(--mono);
      resize: vertical;
      outline: none;
      color: var(--text);
      line-height: 1.7;
      transition: all 0.2s;
    }
    textarea.input-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,0.08); }

    .hint {
      font-size: 0.76rem;
      color: var(--text-tertiary);
      margin-top: 8px;
      line-height: 1.5;
    }

    .api-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--surface-alt);
      border-radius: 8px;
      border: 1px solid var(--border-light);
    }
    .api-key-row label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .api-key-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.82rem;
      font-family: var(--mono);
      outline: none;
      color: var(--text);
    }

    /* Parsed list */
    .parsed-list {
      margin-top: 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .parsed-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.82rem;
    }
    .parsed-item:last-child { border-bottom: none; }
    .parsed-item input[type=checkbox] { accent-color: var(--accent); }
    .parsed-name { font-weight: 600; color: var(--text); min-width: 110px; }
    .parsed-url {
      color: var(--blue);
      font-size: 0.76rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .parsed-detail { font-size: 0.74rem; color: var(--text-tertiary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
    }
    .status-dot.searching { background: var(--orange); animation: pulse 1s infinite; }
    .status-dot.generating { background: var(--blue); animation: pulse 0.6s infinite; }
    .status-dot.done { background: var(--green); }
    .status-dot.error { background: var(--accent); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .progress-bar-wrap {
      height: 3px;
      background: var(--border-light);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--text);
      color: white;
      flex: 1;
    }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary { background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #eee; }

    /* Results */
    .results-list { display: flex; flex-direction: column; gap: 12px; }
    .result-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .result-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .result-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border-light);
    }
    .result-name { font-weight: 700; font-size: 0.88rem; color: var(--text); }
    .result-url { font-size: 0.72rem; color: var(--blue); }
    .result-paper { font-size: 0.72rem; color: var(--text-secondary); font-style: italic; margin-top: 2px; }
    .result-affiliation { font-size: 0.7rem; color: var(--text-tertiary); }

    .result-card-body { padding: 12px 14px; }
    .message-text {
      font-size: 0.84rem;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--surface-alt);
      min-height: 80px;
      outline: none;
    }
    .message-text:focus { border-color: var(--accent); background: white; }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: flex-end;
    }
    .btn-copy {
      background: var(--text);
      color: white;
      font-size: 0.78rem;
      padding: 6px 16px;
    }
    .btn-copy:hover { background: #333; }
    .btn-copy.copied { background: var(--green); }
    .btn-export {
      background: var(--surface-alt);
      color: var(--text-secondary);
      font-size: 0.78rem;
      padding: 5px 14px;
      border: 1px solid var(--border);
    }
    .btn-export:hover { background: #eee; }
    .btn-export:disabled { opacity: 0.35; cursor: not-allowed; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }
    .empty-state p { font-size: 0.86rem; line-height: 1.6; }

    /* ── HISTORY SIDEBAR ── */
    .history-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
      z-index: 100;
    }
    .history-overlay.open { display: block; }
    .history-panel {
      position: fixed;
      top: 0; right: -480px;
      width: 480px; height: 100vh;
      background: var(--surface);
      box-shadow: -4px 0 30px rgba(0,0,0,0.12);
      z-index: 101;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .history-panel.open { right: 0; }
    .history-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-header h2 { font-size: 1rem; font-weight: 700; }
    .history-close {
      background: var(--surface-alt);
      border: none;
      width: 28px; height: 28px;
      border-radius: 7px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .history-close:hover { background: #eee; color: var(--text); }
    .history-toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
    }
    .history-search {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-family: var(--font);
      outline: none;
    }
    .history-search:focus { border-color: var(--accent); }
    .btn-clear-history {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.78rem;
      padding: 6px 12px;
      border: 1px solid #f5c6c6;
    }
    .btn-clear-history:hover { background: #fde8e6; }
    .history-list { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .history-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .history-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .history-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border-light);
    }
    .history-card-name { font-weight: 600; font-size: 0.84rem; }
    .history-card-meta { display: flex; align-items: center; gap: 8px; }
    .history-card-time { font-size: 0.7rem; color: var(--text-tertiary); }
    .history-card-lang { font-size: 0.66rem; padding: 1px 6px; border-radius: 4px; background: #eef; color: #669; }
    .history-card-delete {
      background: none; border: none;
      color: var(--text-tertiary); cursor: pointer;
      font-size: 0.82rem; padding: 2px 6px;
    }
    .history-card-delete:hover { color: var(--accent); }
    .history-card-body { padding: 10px 12px; }
    .history-card-message {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      max-height: 100px;
      overflow: hidden;
    }
    .history-card-message.expanded { max-height: none; }
    .history-card-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
    .btn-history-copy { background: var(--text); color: white; font-size: 0.74rem; padding: 4px 12px; }
    .btn-history-expand { background: var(--surface-alt); color: var(--text-secondary); font-size: 0.74rem; padding: 4px 12px; border: 1px solid var(--border); }
    .history-empty { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Talent Pool</span>
  <div class="nav-links">
    <a href="/discover" class="nav-link">Discover</a>
    <a href="/pool" class="nav-link">Pool</a>
    <a href="/outreach" class="nav-link active">Outreach</a>
  </div>
  <div class="nav-right">
    <button class="nav-btn" onclick="toggleHistory()">历史记录</button>
  </div>
</nav>

<!-- CONFIG BAR -->
<div class="config-bar">
  <div class="config-toggle" id="config-toggle" onclick="toggleConfig()">
    <span class="arrow">&#9654;</span>
    话术配置
    <span class="config-summary" id="config-summary"></span>
  </div>

  <div class="config-body" id="config-body">
    <!-- Mode -->
    <div class="mode-row">
      <span class="mode-label">模式</span>
      <span class="mode-tab active" onclick="setMode('community', this)">开源社区</span>
      <span class="mode-tab" onclick="setMode('academic', this)">学术会议</span>
      <span class="mode-tab" onclick="setMode('custom', this)">自选</span>
      <span style="margin-left:20px" class="mode-label">语言</span>
      <span class="mode-tab active" onclick="setLanguage('zh', this)" data-role="lang">中文</span>
      <span class="mode-tab" onclick="setLanguage('en', this)" data-role="lang">English</span>
    </div>

    <div class="config-grid">
      <!-- Community -->
      <div class="config-field" id="cfg-community-field">
        <label>目标社区</label>
        <input id="cfg-community" type="text" placeholder="如 DeepSpeed、PyTorch..." oninput="updateSummary()" />
        <div class="chip-row" id="community-chips">
          <span class="chip active" onclick="setChip('community','DeepSpeed',this)">DeepSpeed</span>
          <span class="chip" onclick="setChip('community','PyTorch',this)">PyTorch</span>
          <span class="chip" onclick="setChip('community','vLLM',this)">vLLM</span>
          <span class="chip" onclick="setChip('community','LLVM',this)">LLVM</span>
          <span class="chip" onclick="setChip('community','TVM',this)">TVM</span>
          <span class="chip" onclick="setChip('community','Linux Kernel',this)">Kernel</span>
        </div>
      </div>

      <!-- Conference -->
      <div class="config-field" id="cfg-conference-field" style="display:none;">
        <label>目标会议</label>
        <input id="cfg-conference" type="text" placeholder="如 ICML 2025..." oninput="updateSummary()" />
        <div class="chip-row">
          <span class="chip" onclick="setChip('conference','ICML 2025',this)">ICML</span>
          <span class="chip" onclick="setChip('conference','NeurIPS 2025',this)">NeurIPS</span>
          <span class="chip" onclick="setChip('conference','CVPR 2025',this)">CVPR</span>
          <span class="chip" onclick="setChip('conference','ICLR 2025',this)">ICLR</span>
          <span class="chip" onclick="setChip('conference','ACL 2025',this)">ACL</span>
          <span class="chip" onclick="setChip('conference','SIGGRAPH 2025',this)">SIGGRAPH</span>
        </div>
      </div>

      <div class="config-field">
        <label>重点技术方向</label>
        <textarea id="cfg-focus" rows="3" placeholder="模型量化、分布式训练..." oninput="updateSummary()"></textarea>
      </div>

      <div class="config-field">
        <label>额外要求</label>
        <textarea id="cfg-note" rows="3" placeholder="强调技术合作机会..." oninput="updateSummary()"></textarea>
      </div>

      <!-- Model config -->
      <div class="config-field">
        <label>模型</label>
        <div class="provider-tabs">
          <span class="chip active" onclick="setProvider('', this)">自动</span>
          <span class="chip" onclick="setProvider('anthropic', this)">Claude</span>
          <span class="chip" onclick="setProvider('openai', this)">OpenAI 兼容</span>
        </div>
        <div class="model-fields">
          <input id="cfg-model" type="text" placeholder="由 .env 决定" />
        </div>
        <div class="field-hint" id="model-hint">默认：本地 LM Studio</div>
        <div id="base-url-wrap" style="margin-top:6px;display:none;">
          <input id="cfg-base-url" type="text" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.82rem;font-family:var(--mono);outline:none;" placeholder="API 地址" />
        </div>
      </div>
    </div>

    <!-- Sender -->
    <div class="sender-section">
      <label style="display:block;font-size:0.72rem;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">发件人信息</label>
      <div class="sender-grid">
        <input id="sender-name" placeholder="Your name" oninput="debounceSaveSender()" />
        <input id="sender-team" placeholder="Team / company" oninput="debounceSaveSender()" />
        <input id="sender-contact" placeholder="WeChat / email" oninput="debounceSaveSender()" />
      </div>
      <div class="sender-saved" id="sender-saved">已保存</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <!-- Left: Input -->
  <div class="panel">
    <div class="panel-header">
      <h2 id="input-panel-title">人员名单</h2>
      <span class="badge" id="count-badge">0 人</span>
    </div>
    <div class="panel-body">
      <div class="api-key-row">
        <label>API Key</label>
        <input id="api-key" type="password" placeholder="本地模型可留空" />
      </div>

      <textarea class="input-area" id="input-area" placeholder="粘贴名单，每行一条：&#10;姓名    GitHub用户名    LinkedIn链接"></textarea>
      <p class="hint" id="input-hint">支持 Tab 或多个空格分隔。三列均可选。</p>

      <div id="parsed-list" class="parsed-list" style="display:none;"></div>

      <div class="progress-bar-wrap" id="progress-wrap" style="display:none;">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="parse-btn" onclick="handleParse()" style="flex:none;">解析</button>
        <button class="btn-primary" id="gen-btn" onclick="handleGenerate()" disabled>生成消息</button>
      </div>
    </div>
  </div>

  <!-- Right: Results -->
  <div class="panel">
    <div class="panel-header">
      <h2>生成结果</h2>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge" id="result-badge">0 条</span>
        <button class="btn-export" id="export-btn" onclick="exportExcel()" disabled>导出 Excel</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="results-list" class="results-list">
        <div class="empty-state" id="empty-state">
          <p>配置话术参数，粘贴名单<br>生成后消息将逐条出现</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY SIDEBAR -->
<div class="history-overlay" id="history-overlay" onclick="toggleHistory()"></div>
<div class="history-panel" id="history-panel">
  <div class="history-header">
    <h2>历史记录</h2>
    <button class="history-close" onclick="toggleHistory()">&#10005;</button>
  </div>
  <div class="history-toolbar">
    <input class="history-search" id="history-search" placeholder="搜索..." oninput="debounceLoadHistory()" />
    <button class="btn-clear-history" onclick="clearAllHistory()">清空</button>
  </div>
  <div class="history-list" id="history-list">
    <div class="history-empty"><p>暂无记录</p></div>
  </div>
</div>

<script>
  let parsedPeople = [];
  let parsedPapers = [];
  let resultCount = 0;
  let exportData = [];
  let currentLanguage = 'zh';
  let currentMode = 'community';
  let currentProvider = '';

  // ── Config ──
  function toggleConfig() {
    const body = document.getElementById('config-body');
    const toggle = document.getElementById('config-toggle');
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    toggle.classList.toggle('open', !isOpen);
  }

  function setMode(mode, el) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab:not([data-role])').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const isAcademic = mode === 'academic';
    const isCustom = mode === 'custom';
    document.getElementById('cfg-community-field').style.display = (isAcademic || isCustom) ? 'none' : '';
    document.getElementById('cfg-conference-field').style.display = isAcademic ? '' : 'none';
    if (isCustom) {
      document.getElementById('input-panel-title').textContent = '候选人名单';
      document.getElementById('input-area').placeholder = '粘贴名单，每行一条：\n姓名    职位/公司    LinkedIn链接\n\n例如：\nZhang Wei    Senior Engineer@Google    https://www.linkedin.com/in/zhangwei/\nLi Ming    Staff ML Engineer@Meta';
      document.getElementById('input-hint').textContent = '直接输入候选人信息，或从人才库选人后跳转到这里。支持 Tab 分隔。';
      document.getElementById('parse-btn').textContent = '解析';
    } else if (isAcademic) {
      document.getElementById('input-panel-title').textContent = '论文标题';
      document.getElementById('input-area').placeholder = '每行一个论文标题：\n\nFlashAttention: Fast and Memory-Efficient Exact Attention\nLoRA: Low-Rank Adaptation of Large Language Models';
      document.getElementById('input-hint').textContent = '每行一个论文标题，将通过 Semantic Scholar 自动查找作者。';
      document.getElementById('parse-btn').textContent = '查询';
    } else {
      document.getElementById('input-panel-title').textContent = '人员名单';
      document.getElementById('input-area').placeholder = '粘贴名单，每行一条：\n姓名    GitHub用户名    LinkedIn链接';
      document.getElementById('input-hint').textContent = '支持 Tab 或多个空格分隔。三列均可选。';
      document.getElementById('parse-btn').textContent = '解析';
    }
    document.getElementById('input-area').value = '';
    document.getElementById('parsed-list').style.display = 'none';
    document.getElementById('count-badge').textContent = '0 人';
    document.getElementById('gen-btn').disabled = true;
    parsedPeople = [];
    parsedPapers = [];
    updateSummary();
  }

  function setLanguage(lang, el) {
    currentLanguage = lang;
    document.querySelectorAll('.mode-tab[data-role=lang]').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  function setChip(field, value, el) {
    document.getElementById(`cfg-${field}`).value = value;
    el.closest('.chip-row, .provider-tabs').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    updateSummary();
  }

  function setProvider(provider, el) {
    currentProvider = provider;
    el.closest('.provider-tabs').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('base-url-wrap').style.display = provider === 'openai' ? 'block' : 'none';
    const modelEl = document.getElementById('cfg-model');
    const hint = document.getElementById('model-hint');
    if (provider === '') { modelEl.placeholder = '由 .env 决定'; hint.textContent = '默认：本地 LM Studio'; }
    else if (provider === 'openai') { modelEl.placeholder = '模型名'; hint.textContent = '填入 API 地址和模型名'; }
    else { modelEl.placeholder = 'claude-opus-4-6'; hint.textContent = '默认：Claude'; }
  }

  function updateSummary() {
    const parts = [];
    if (currentMode === 'academic') {
      const c = document.getElementById('cfg-conference').value.trim();
      if (c) parts.push(c);
    } else {
      const c = document.getElementById('cfg-community').value.trim();
      if (c) parts.push(c);
    }
    const f = document.getElementById('cfg-focus').value.trim();
    if (f) parts.push(f.slice(0, 25) + (f.length > 25 ? '...' : ''));
    document.getElementById('config-summary').textContent = parts.length ? `(${parts.join(' · ')})` : '';
  }

  // ── Sender ──
  let senderTimer = null;
  function debounceSaveSender() { clearTimeout(senderTimer); senderTimer = setTimeout(saveSender, 800); }
  async function saveSender() {
    await fetch('/api/sender', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('sender-name').value.trim(),
        team: document.getElementById('sender-team').value.trim(),
        contact: document.getElementById('sender-contact').value.trim(),
      }),
    });
    const el = document.getElementById('sender-saved');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }
  async function loadSender() {
    const resp = await fetch('/api/sender');
    const data = await resp.json();
    if (data.name) document.getElementById('sender-name').value = data.name;
    if (data.team) document.getElementById('sender-team').value = data.team;
    if (data.contact) document.getElementById('sender-contact').value = data.contact;
  }

  function getConfig() {
    return {
      mode: currentMode,
      community: document.getElementById('cfg-community').value.trim(),
      conference: document.getElementById('cfg-conference').value.trim(),
      focus_areas: document.getElementById('cfg-focus').value.trim(),
      custom_note: document.getElementById('cfg-note').value.trim(),
      provider: currentProvider,
      model_name: document.getElementById('cfg-model').value.trim(),
      base_url: document.getElementById('cfg-base-url')?.value.trim() || '',
      language: currentLanguage,
    };
  }

  // ── Parse & Generate ──
  function handleParse() { currentMode === 'academic' ? lookupPapers() : parseInput(); }
  function handleGenerate() { currentMode === 'academic' ? generateAcademic() : generateAll(); }

  // Custom mode also uses parseInput and generateAll — the backend handles it via mode='custom' in config

  document.getElementById('input-area').addEventListener('input', () => {
    if (currentMode === 'community') parseInput(true);
  });

  function parseInput(silent = false) {
    const raw = document.getElementById('input-area').value.trim();
    const lines = raw.split('\n').filter(l => l.trim());
    parsedPeople = [];
    for (const line of lines) {
      const parts = line.trim().split(/\t|  +/).map(p => p.trim()).filter(Boolean);
      if (!parts.length) continue;
      let name = '', url = '', github = '', context = '';
      for (const part of parts) {
        if (part.startsWith('http')) url = part;
        else if (!name) name = part;
        else if (currentMode === 'custom') {
          // In custom mode, treat extra columns as context (title@company etc.)
          context = context ? context + ' | ' + part : part;
        } else {
          if (!github) github = part;
        }
      }
      if (name) parsedPeople.push({ name, url, github, context });
    }
    document.getElementById('count-badge').textContent = `${parsedPeople.length} 人`;
    const listEl = document.getElementById('parsed-list');
    if (!parsedPeople.length) { listEl.style.display = 'none'; document.getElementById('gen-btn').disabled = true; return; }
    listEl.style.display = 'block';
    listEl.innerHTML = parsedPeople.map((p, i) => `
      <div class="parsed-item" id="item-${i}">
        <input type="checkbox" checked data-index="${i}" />
        <span class="parsed-name">${esc(p.name)}</span>
        ${p.context ? `<span class="parsed-detail">${esc(p.context)}</span>` : ''}
        ${p.github ? `<span class="parsed-detail">@${esc(p.github)}</span>` : ''}
        <span class="parsed-url">${p.url ? esc(p.url) : ''}</span>
        <div class="status-dot" id="dot-${i}"></div>
      </div>
    `).join('');
    document.getElementById('gen-btn').disabled = false;
  }

  async function generateAll() {
    const apiKey = document.getElementById('api-key').value.trim();
    const checkboxes = document.querySelectorAll('.parsed-list input[type=checkbox]:checked');
    const selected = Array.from(checkboxes).map(cb => parsedPeople[cb.dataset.index]);
    if (!selected.length) { alert('请选择至少一个人'); return; }

    document.getElementById('gen-btn').disabled = true;
    document.getElementById('gen-btn').textContent = '生成中...';
    document.getElementById('results-list').innerHTML = '';
    resultCount = 0; exportData = [];
    document.getElementById('result-badge').textContent = '0 条';
    document.getElementById('export-btn').disabled = true;

    const progWrap = document.getElementById('progress-wrap');
    const progBar = document.getElementById('progress-bar');
    progWrap.style.display = 'block';
    progBar.style.width = '0%';

    let done = 0;
    const config = getConfig();

    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey },
      body: JSON.stringify({ people: selected, config })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done: streamDone } = await reader.read();
      if (streamDone) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        if (data.status === 'searching') setDot(data.name, 'searching');
        else if (data.status === 'generating') setDot(data.name, 'generating');
        else if (data.status === 'done') {
          setDot(data.name, 'done');
          done++;
          progBar.style.width = `${(done / selected.length) * 100}%`;
          addResultCard(data, config);
          exportData.push({ name: data.name, url: data.url, message: data.message, community: config.community || '' });
          document.getElementById('export-btn').disabled = false;
        } else if (data.status === 'complete') {
          document.getElementById('gen-btn').disabled = false;
          document.getElementById('gen-btn').textContent = '生成消息';
        }
      }
    }
  }

  function setDot(name, status) {
    document.querySelectorAll('.parsed-item').forEach(item => {
      if (item.querySelector('.parsed-name')?.textContent === name)
        item.querySelector('.status-dot').className = `status-dot ${status}`;
    });
  }

  function addResultCard(data, config) {
    resultCount++;
    document.getElementById('result-badge').textContent = `${resultCount} 条`;
    const tag = config.community || config.conference || '';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-card-header">
        <div>
          <div class="result-name">${esc(data.name)}</div>
          ${data.url ? `<div class="result-url">${esc(data.url)}</div>` : ''}
          ${data.paper ? `<div class="result-paper">${esc(data.paper)}</div>` : ''}
          ${data.affiliation ? `<div class="result-affiliation">${esc(data.affiliation)}</div>` : ''}
        </div>
        ${tag ? `<span style="font-size:0.72rem;color:var(--text-tertiary)">${esc(tag)}</span>` : ''}
      </div>
      <div class="result-card-body">
        <div class="message-text" contenteditable="true" id="msg-${resultCount}">${esc(data.message)}</div>
        <div class="card-actions">
          <button class="btn-copy" id="copy-${resultCount}" onclick="copyMsg(${resultCount})">复制</button>
        </div>
      </div>`;
    document.getElementById('results-list').appendChild(card);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function copyMsg(id) {
    const text = document.getElementById(`msg-${id}`).innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById(`copy-${id}`);
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // ── Academic mode ──
  async function lookupPapers() {
    const raw = document.getElementById('input-area').value.trim();
    const titles = raw.split('\n').map(l => l.trim()).filter(Boolean);
    if (!titles.length) { alert('请输入至少一个论文标题'); return; }

    const parseBtn = document.getElementById('parse-btn');
    parseBtn.disabled = true;
    parseBtn.textContent = '查询中...';

    const listEl = document.getElementById('parsed-list');
    listEl.style.display = 'block';
    listEl.innerHTML = '';
    parsedPapers = [];
    let totalAuthors = 0;

    for (const title of titles) {
      try {
        const resp = await fetch('/api/lookup-paper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!resp.ok) {
          listEl.innerHTML += `<div class="parsed-item"><span class="parsed-detail" style="color:var(--accent)">未找到：${esc(title.slice(0,50))}</span></div>`;
          continue;
        }
        const paper = await resp.json();
        parsedPapers.push(paper);
        listEl.innerHTML += `<div class="parsed-item" style="background:var(--surface-alt);border-left:3px solid var(--accent)">
          <input type="checkbox" checked data-paper-idx="${parsedPapers.length-1}" class="paper-checkbox" />
          <span class="parsed-name" style="font-size:0.8rem">${esc(paper.title.slice(0,65))}</span>
          <span class="parsed-detail">${esc(paper.venue||'')} · ${paper.authors.length} authors</span>
        </div>`;
        for (const a of paper.authors) {
          totalAuthors++;
          listEl.innerHTML += `<div class="parsed-item" style="padding-left:36px">
            <span class="parsed-name" style="min-width:90px;font-size:0.8rem">${esc(a.name)}</span>
            <span class="parsed-detail">${a.affiliation ? esc(a.affiliation) : ''}</span>
          </div>`;
        }
      } catch(e) {
        listEl.innerHTML += `<div class="parsed-item"><span class="parsed-detail" style="color:var(--accent)">失败：${esc(title.slice(0,50))}</span></div>`;
      }
    }

    document.getElementById('count-badge').textContent = `${totalAuthors} 人 / ${parsedPapers.length} 篇`;
    parseBtn.disabled = false;
    parseBtn.textContent = '查询';
    document.getElementById('gen-btn').disabled = parsedPapers.length === 0;
  }

  async function generateAcademic() {
    const apiKey = document.getElementById('api-key').value.trim();
    const checkboxes = document.querySelectorAll('.paper-checkbox:checked');
    const selectedPapers = Array.from(checkboxes).map(cb => parsedPapers[cb.dataset.paperIdx]);
    if (!selectedPapers.length) { alert('请至少选择一篇论文'); return; }

    let totalAuthors = 0;
    selectedPapers.forEach(p => totalAuthors += p.authors.length);

    document.getElementById('gen-btn').disabled = true;
    document.getElementById('gen-btn').textContent = '生成中...';
    document.getElementById('results-list').innerHTML = '';
    resultCount = 0; exportData = [];
    document.getElementById('result-badge').textContent = '0 条';
    document.getElementById('export-btn').disabled = true;

    const progWrap = document.getElementById('progress-wrap');
    const progBar = document.getElementById('progress-bar');
    progWrap.style.display = 'block';
    progBar.style.width = '0%';

    let done = 0;
    const config = getConfig();

    const resp = await fetch('/api/generate-academic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey },
      body: JSON.stringify({ papers: selectedPapers, config }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done: streamDone } = await reader.read();
      if (streamDone) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        if (data.status === 'done') {
          done++;
          progBar.style.width = `${(done / totalAuthors) * 100}%`;
          addResultCard(data, config);
          exportData.push({ name: data.name, paper: data.paper||'', affiliation: data.affiliation||'', message: data.message, conference: config.conference||'' });
          document.getElementById('export-btn').disabled = false;
        } else if (data.status === 'complete') {
          document.getElementById('gen-btn').disabled = false;
          document.getElementById('gen-btn').textContent = '生成消息';
        }
      }
    }
  }

  // ── Excel ──
  function exportExcel() {
    if (!exportData.length) return;
    const isAcademic = currentMode === 'academic';
    const rows = exportData.map((d, i) => {
      const msgEl = document.getElementById(`msg-${i+1}`);
      if (isAcademic) return { '姓名': d.name, '机构': d.affiliation, '论文': d.paper, '会议': d.conference, '消息': msgEl ? msgEl.innerText : d.message };
      return { '姓名': d.name, 'LinkedIn': d.url||'', '社区': d.community, '消息': msgEl ? msgEl.innerText : d.message };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '消息');
    const now = new Date();
    const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    XLSX.writeFile(wb, `消息_${ts}.xlsx`);
  }

  // ── History ──
  function toggleHistory() {
    const overlay = document.getElementById('history-overlay');
    const panel = document.getElementById('history-panel');
    const isOpen = panel.classList.contains('open');
    overlay.classList.toggle('open', !isOpen);
    panel.classList.toggle('open', !isOpen);
    if (!isOpen) loadHistory();
  }

  let historyTimer = null;
  function debounceLoadHistory() { clearTimeout(historyTimer); historyTimer = setTimeout(loadHistory, 400); }

  async function loadHistory() {
    const search = document.getElementById('history-search').value.trim();
    const resp = await fetch(`/api/history?search=${encodeURIComponent(search)}`);
    const data = await resp.json();
    const listEl = document.getElementById('history-list');
    if (!data.length) { listEl.innerHTML = `<div class="history-empty"><p>${search ? '无匹配' : '暂无记录'}</p></div>`; return; }
    listEl.innerHTML = data.map(item => `
      <div class="history-card" id="hcard-${item.id}">
        <div class="history-card-header">
          <span class="history-card-name">${esc(item.name)}</span>
          <div class="history-card-meta">
            <span class="history-card-time">${formatTime(item.created_at)}</span>
            <button class="history-card-delete" onclick="deleteHistoryItem(${item.id})">&#10005;</button>
          </div>
        </div>
        <div class="history-card-body">
          <div class="history-card-message" id="hmsg-${item.id}">${esc(item.message)}</div>
          <div class="history-card-actions">
            <button class="btn-history-expand" onclick="document.getElementById('hmsg-${item.id}').classList.toggle('expanded')">展开</button>
            <button class="btn-history-copy" onclick="navigator.clipboard.writeText(document.getElementById('hmsg-${item.id}').innerText)">复制</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function deleteHistoryItem(id) {
    await fetch(`/api/history/${id}`, { method: 'DELETE' });
    document.getElementById(`hcard-${id}`)?.remove();
  }
  async function clearAllHistory() {
    if (!confirm('确定清空？')) return;
    await fetch('/api/history/clear', { method: 'POST' });
    loadHistory();
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts + 'Z');
    const diff = Date.now() - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return `${Math.floor(diff/60000)}分钟前`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──
  updateSummary();
  loadSender();

  // Receive from talent pool
  (function checkTalentPool() {
    const raw = sessionStorage.getItem('selected_people');
    if (!raw) return;
    sessionStorage.removeItem('selected_people');
    const people = JSON.parse(raw);
    if (!people.length) return;

    // Switch to custom mode for talent pool candidates
    const customTab = document.querySelectorAll('.mode-tab:not([data-role])')[2]; // 3rd tab = 自选
    setMode('custom', customTab);

    // Build lines with context (title + company)
    const lines = people.map(p => {
      const parts = [p.name];
      const ctx = [p.title, p.company].filter(Boolean).join(' @ ');
      if (ctx) parts.push(ctx);
      if (p.url) parts.push(p.url);
      return parts.join('\t');
    });
    document.getElementById('input-area').value = lines.join('\n');
    parseInput();

    // Open config panel
    const body = document.getElementById('config-body');
    const toggle = document.getElementById('config-toggle');
    if (!body.classList.contains('open')) { body.classList.add('open'); toggle.classList.add('open'); }
  })();
</script>
</body>
